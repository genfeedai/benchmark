name: ci

on:
  push:
    branches: [master]
  pull_request:

# Least-privilege default token; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run validate
      # The ladder and the task index are both derived. If recomputing either
      # changes the committed tree, someone hand-edited published data.
      - run: bun run ladder
      - run: bun run build:index
      - name: derived data is reproducible
        run: |
          if ! git diff --quiet -- data/seasons data/tasks.json; then
            echo "::error::committed data does not match a fresh recompute"
            git --no-pager diff -- data/seasons data/tasks.json
            exit 1
          fi
